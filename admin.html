<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RR Collections — Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #C9952A; --gold-light: #F0C96B;
    --maroon: #6B1A2A; --maroon-dk: #3E0D17;
    --cream: #FAF6EF; --text-mid: #5C3D45;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, var(--maroon-dk) 0%, var(--maroon) 50%, #8B2A3A 100%);
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--cream); border-radius: 8px;
    padding: 48px 40px; width: 100%; max-width: 420px;
    box-shadow: 0 24px 80px rgba(20,5,10,0.4);
  }
  .login-logo {
    text-align: center; margin-bottom: 32px;
  }
  .login-logo h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; font-weight: 600; color: var(--maroon);
  }
  .login-logo h1 span { color: var(--gold); }
  .login-logo p { font-size: 13px; color: var(--text-mid); margin-top: 4px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-mid); margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 12px 14px;
    border: 1px solid rgba(107,26,42,0.2);
    border-radius: 4px; font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none; transition: border-color 0.2s;
    background: white; color: var(--maroon-dk);
  }
  .form-group input:focus { border-color: var(--gold); }
  .login-btn {
    width: 100%; padding: 13px;
    background: var(--maroon); color: var(--cream);
    border: none; border-radius: 4px;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; margin-top: 8px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: #8B2A3A; }
  .error-msg {
    display: none; background: #FEE; border: 1px solid #FCC;
    color: #C00; padding: 10px 14px; border-radius: 4px;
    font-size: 13px; margin-bottom: 16px; text-align: center;
  }
  .loading { display: none; text-align: center; color: var(--text-mid); font-size: 13px; margin-top: 12px; }
  .divider { text-align: center; margin: 24px 0 0; font-family: 'Cormorant Garamond', serif; color: var(--gold); opacity: 0.4; letter-spacing: 10px; font-size: 16px; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <h1>RR <span>Collections</span></h1>
    <p>Admin Panel — Secure Login</p>
  </div>
  <div class="error-msg" id="error-msg">Invalid email or password. Please try again.</div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="adithyakurapati1234@gmail.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="login-btn" onclick="loginAdmin()">Login to Admin Panel</button>
  <div class="loading" id="loading">⏳ Logging in...</div>
  <div class="divider">✦ ✦ ✦</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5s1N2A2dl_eKMaSuviMuHT9O8RCJG4-M",
    authDomain: "rr-collections.firebaseapp.com",
    projectId: "rr-collections",
    storageBucket: "rr-collections.firebasestorage.app",
    messagingSenderId: "751695680040",
    appId: "1:751695680040:web:656f9e89b76e7c26909b1d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.loginAdmin = async function() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('error-msg');
    const loading  = document.getElementById('loading');

    if (!email || !password) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Please enter both email and password.';
      return;
    }

    errorMsg.style.display = 'none';
    loading.style.display = 'block';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      loading.style.display = 'none';
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Invalid email or password. Please try again.';
    }
  }

  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.loginAdmin();
  });
</script>
</body>
</html>
